<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>try{if(localStorage.getItem("mistto-tema")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site — Mistto</title>
<style>body{margin:0;font-family:system-ui,sans-serif}#load{display:flex;height:100vh;align-items:center;justify-content:center;color:#8a99ad}</style>
</head>
<body>
<div id="load">Carregando…</div>
<script>
const SB_URL = "https://unsvccbzrrgnvzvdwwrz.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuc3ZjY2J6cnJnbnZ6dmR3d3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MzE0OTUsImV4cCI6MjEwMDAwNzQ5NX0.LI121gkIHkiplDTcolv6e6is6LxN0I1Ebmil5tJKRxY";
(async function(){
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var slug = params.get('s');
  if(!id && !slug){ document.getElementById('load').textContent = 'Site não encontrado.'; return; }
  var filtro = id ? ('id=eq.' + encodeURIComponent(id)) : ('slug=eq.' + encodeURIComponent(slug));
  try{
    var res = await fetch(SB_URL + '/rest/v1/mistto_sites?' + filtro + '&select=html', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    var rows = await res.json();
    if(!rows || !rows.length || !rows[0].html){ document.getElementById('load').textContent = 'Site não encontrado.'; return; }
    var html = rows[0].html;
    var editMode = !!params.get('edit');
    document.open(); document.write(html); document.close();
    if(editMode){ setupSelector(); }
  }catch(e){ document.getElementById('load').textContent = 'Erro ao carregar.'; }
})();

/* ===== Modo edição: seleção + manipulação direta (roda dentro do iframe) ===== */
var HL = '__mistto_sel', HV = '__mistto_hover';
function setupSelector(){
  // estilo dos realces
  var st = document.createElement('style'); st.id = '__mistto_css';
  st.textContent = '.'+HL+'{outline:2px solid #D4A017 !important;outline-offset:2px !important}'
    + '.'+HV+'{outline:1px dashed rgba(212,160,23,.6) !important;outline-offset:2px !important;cursor:pointer}'
    + '[contenteditable=true]{outline:2px dashed #D4A017 !important}';
  document.head.appendChild(st);

  var sel = null, hov = null;

  function rgb2hex(s){
    var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(s || ''); if(!m) return '';
    function h(n){ n = parseInt(n,10).toString(16); return n.length < 2 ? '0'+n : n; }
    return '#' + h(m[1]) + h(m[2]) + h(m[3]);
  }
  function info(el){
    var txt = (el.textContent || '').replace(/\s+/g,' ').trim().slice(0,60);
    var tag = el.tagName.toLowerCase();
    var desc = txt ? (tag + ' “' + txt + '”') : ('elemento <' + tag + '>');
    var cs = getComputedStyle(el);
    return { mistto:'select', tag:tag, text:txt, desc:desc, cor:rgb2hex(cs.color), fundo:rgb2hex(cs.backgroundColor) };
  }
  function clean(){
    var c = document.documentElement.cloneNode(true);
    var lixo = c.querySelectorAll('#__mistto_css, #__mistto_js');
    for(var i=0;i<lixo.length;i++){ lixo[i].parentNode && lixo[i].parentNode.removeChild(lixo[i]); }
    var marc = c.querySelectorAll('.'+HL+', .'+HV);
    for(var j=0;j<marc.length;j++){ marc[j].classList.remove(HL); marc[j].classList.remove(HV); if(!marc[j].getAttribute('class')) marc[j].removeAttribute('class'); }
    var ce = c.querySelectorAll('[contenteditable]');
    for(var k=0;k<ce.length;k++){ ce[k].removeAttribute('contenteditable'); }
    return c;
  }
  function serialize(){ return '<!DOCTYPE html>\n' + clean().outerHTML; }
  function salvar(){ try{ parent.postMessage({ mistto:'saved', html: serialize() }, '*'); }catch(_){} }
  function pick(el){
    if(sel) sel.classList.remove(HL);
    sel = el; sel.classList.remove(HV); sel.classList.add(HL);
    try{ parent.postMessage(info(sel), '*'); }catch(_){}
  }

  document.addEventListener('mouseover', function(e){ if(hov && hov !== sel) hov.classList.remove(HV); hov = e.target; if(hov !== sel) hov.classList.add(HV); }, true);
  document.addEventListener('mouseout', function(e){ if(e.target !== sel) e.target.classList.remove(HV); }, true);
  document.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); pick(e.target); }, true);

  window.addEventListener('message', function(ev){
    var d = ev.data; if(!d || d.mistto !== 'act' || !sel) return;
    var a = d.action;
    if(a === 'apagar'){ var p = sel; sel = null; p.classList.remove(HL); p.parentNode && p.parentNode.removeChild(p); try{ parent.postMessage({ mistto:'cleared' }, '*'); }catch(_){}; salvar(); return; }
    if(a === 'cima'){ var pv = sel.previousElementSibling; if(pv) sel.parentNode.insertBefore(sel, pv); salvar(); return; }
    if(a === 'baixo'){ var nx = sel.nextElementSibling; if(nx) sel.parentNode.insertBefore(nx, sel); salvar(); return; }
    if(a === 'cor'){ sel.style.color = d.value; salvar(); return; }
    if(a === 'fundo'){ sel.style.backgroundColor = d.value; salvar(); return; }
    if(a === 'cantos'){ sel.style.borderRadius = d.value; salvar(); return; }
    if(a === 'maior'){ bumpFont(sel, 1.12); salvar(); return; }
    if(a === 'menor'){ bumpFont(sel, 0.9); salvar(); return; }
    if(a === 'texto'){
      sel.setAttribute('contenteditable','true'); sel.focus();
      var fim = function(){ sel.setAttribute('contenteditable','false'); sel.removeEventListener('blur', fim); salvar(); };
      sel.addEventListener('blur', fim); return;
    }
  });

  function bumpFont(el, fator){
    var px = parseFloat(getComputedStyle(el).fontSize) || 16;
    el.style.fontSize = Math.max(8, Math.round(px * fator)) + 'px';
  }
}
</script>
</body>
</html>

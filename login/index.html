<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>try{if(localStorage.getItem("mistto-tema")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Mistto</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
  <div class="wrap nav-in">
    <a href="/" class="logo">Mis<b>tto</b></a>
    <button class="nav-toggle" onclick="toggleNav()">☰</button>
    <div class="nav-links">
      <a href="/recursos/">Recursos</a>
      <a href="/precos/">Preços</a>
      <a href="/wecoins/">WeCoins</a>
      <a href="/login/" class="active">Entrar</a>
      <a href="/cadastro/" class="btn btn-gold">Criar conta</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Bem-vindo de volta</h1>
    <p class="subtitle">Entre pra acessar seu painel do Mistto.</p>
    <form onsubmit="doLogin(event)">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="sua senha" required>
      </div>
      <button type="submit" class="btn btn-gold">Entrar</button>
    </form>
    <button id="bio-btn" type="button" class="btn btn-ghost" onclick="entrarComBiometria()" style="display:none;width:100%;justify-content:center;margin-top:12px;gap:8px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11c-1.5 0-3 1-3 3v3"/><path d="M12 11c1.5 0 3 1 3 3v1"/><path d="M7 12a5 5 0 0 1 8-4"/><path d="M5 10a7 7 0 0 1 11-3.5"/><path d="M12 7a4 4 0 0 1 4 4v2"/></svg>
      Entrar com biometria
    </button>
    <div id="auth-msg" class="auth-msg"></div>
    <p class="auth-alt">Não tem conta ainda? <a href="/cadastro/">Criar conta</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>
<script>initLogin();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar site — Mistto</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
  <div class="wrap nav-in">
    <a href="/" class="logo">Mis<b>tto</b></a>
    <button class="nav-toggle" onclick="toggleNav()">☰</button>
    <div class="nav-links">
      <a href="/painel/">Painel</a>
      <a href="/precos/">Planos</a>
      <a href="/docs/">Docs</a>
      <a href="#" onclick="doLogout();return false;">Sair</a>
    </div>
  </div>
</nav>

<div class="auth-wrap" style="align-items:flex-start;padding-top:130px">
  <div style="width:100%;max-width:680px;position:relative;z-index:2">
    <div style="text-align:center;margin-bottom:26px">
      <span class="tag">Novo site</span>
      <h1 style="font-size:2.6rem;margin-top:14px">O que vamos <span class="gold">criar</span> hoje?</h1>
      <p style="color:var(--muted);margin-top:10px">Descreva seu site em português normal. Quanto mais detalhe, melhor.</p>
    </div>

    <div class="prompt-box" style="max-width:none">
      <input id="create-nome" type="text" placeholder="Nome do projeto — ex: Café da Serra" autocomplete="off"
        style="width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--line);color:var(--ink);font-family:'Fraunces',serif;font-size:1.25rem;font-weight:700;padding:2px 2px 12px;margin-bottom:14px;outline:none">
      <textarea id="create-prompt" placeholder="O que é o site? Pode ser só uma ideia solta (ex: 'me surpreenda') ou cheio de detalhes — a Mistto pergunta o que faltar." rows="4"></textarea>
      <div class="prompt-row">
        <div class="prompt-chips" id="create-chips">
          <span class="chip" data-prompt="Um site pra minha cafeteria, com cardápio, fotos e botão de WhatsApp. Tom aconchegante.">Cafeteria</span>
          <span class="chip" data-prompt="Um portfólio elegante e minimalista pra mostrar meus trabalhos de design.">Portfólio</span>
          <span class="chip" data-prompt="Um site de personal trainer, com planos, depoimentos e agendamento.">Personal</span>
          <span class="chip" data-prompt="Uma landing pra meu evento, com programação, palestrantes e inscrição.">Evento</span>
        </div>
        <span style="display:flex;gap:8px;align-items:center">
          <select id="create-provider" style="background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:11px 14px;font-family:'Inter';color:var(--ink);outline:none">
            <option value="gemini">IA: Gemini</option>
            <option value="groq">IA: Groq</option>
            <option value="cerebras">IA: Cerebras</option>
            <option value="openrouter">IA: OpenRouter</option>
          </select>
          <button onclick="gerarSite()" class="btn btn-gold">Começar com a Mistto</button>
        </span>
      </div>
    </div>

    <p id="create-status" style="display:none;text-align:center;margin-top:20px;font-weight:500;color:var(--muted)"></p>
    <div id="create-result" style="display:none;margin-top:24px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>
<script>initCreate();</script>
</body>
</html>

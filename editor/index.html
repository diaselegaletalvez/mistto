<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>try{if(localStorage.getItem("mistto-tema")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor — Mistto</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="ed-body">

<div class="ed">
  <!-- COLUNA DA ESQUERDA: CHAT -->
  <aside class="ed-chat">
    <header class="ed-chat-top">
      <a href="/painel/" class="logo">Mis<b>tto</b></a>
      <a href="/painel/" class="ed-back">Painel</a>
    </header>

    <div class="ed-msgs" id="ed-msgs">
      <div class="msg ai"><span class="who">Mistto</span>Carregando seu site…</div>
    </div>

    <div class="ed-input">
      <div class="ed-composer">
        <div id="ed-selecao" class="ed-selecao" style="display:none"></div>
        <div id="ed-acoes" class="ed-acoes" style="display:none">
          <button type="button" class="ed-acao" onclick="edAcao('texto')" title="Editar o texto">Texto</button>
          <button type="button" class="ed-acao" onclick="edAcao('maior')" title="Aumentar">A+</button>
          <button type="button" class="ed-acao" onclick="edAcao('menor')" title="Diminuir">A−</button>
          <label class="ed-acao ed-acao-cor" title="Cor do texto">Cor<input type="color" id="ed-cor" onchange="edAcao('cor', this.value)"></label>
          <label class="ed-acao ed-acao-cor" title="Cor de fundo">Fundo<input type="color" id="ed-fundo" onchange="edAcao('fundo', this.value)"></label>
          <button type="button" class="ed-acao" onclick="edAcao('cantos','14px')" title="Arredondar cantos">Cantos</button>
          <button type="button" class="ed-acao" onclick="edAcao('cima')" title="Mover pra cima">↑</button>
          <button type="button" class="ed-acao" onclick="edAcao('baixo')" title="Mover pra baixo">↓</button>
          <button type="button" class="ed-acao" onclick="edAcao('duplicar')" title="Duplicar">Duplicar</button>
          <button type="button" class="ed-acao ed-acao-del" onclick="edAcao('apagar')" title="Apagar">Apagar</button>
        </div>
        <div id="ed-anexo" class="ed-anexo" style="display:none"></div>
        <textarea id="ed-prompt" rows="1" placeholder="Escreva uma mensagem…"></textarea>
        <div class="ed-composer-bar">
          <div class="ed-left">
            <button class="ed-attach" aria-label="Anexar imagem" title="Anexar imagem" onclick="edAnexar()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
            <select id="ed-provider" class="ed-prov" aria-label="Escolher IA">
              <option value="cerebras" selected>IA: Cerebras (rápida)</option>
              <option value="groq">IA: Groq</option>
              <option value="gemini">IA: Gemini</option>
              <option value="openrouter">IA: OpenRouter</option>
            </select>
          </div>
          <button id="ed-send" class="ed-send-btn" aria-label="Enviar" onclick="edSendOrStop()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <input type="file" id="ed-file" accept="image/*" style="display:none" onchange="edArquivoEscolhido(event)">
      </div>
    </div>
  </aside>

  <!-- COLUNA DA DIREITA: PREVIEW -->
  <main class="ed-preview">
    <div class="ed-bar">
      <div class="ed-dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="ed-url" id="ed-url">mistto.weblar.app.br/s/…</div>
      <div class="ed-bar-actions">
        <span class="ed-view">
          <button id="edv-full" class="on" onclick="edVer('full')" title="Computador" aria-label="Computador"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
          <button id="edv-cel" onclick="edVer('cel')" title="Celular" aria-label="Celular"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg></button>
        </span>
        <button class="btn btn-ghost ed-mini" id="ed-undo" onclick="edDesfazer()">Desfazer</button>
        <button class="btn btn-ghost ed-mini" id="ed-hist" onclick="edHistorico()">Histórico</button>
        <button class="btn btn-ghost ed-mini" id="ed-pub" onclick="togglePub()">Publicar</button>
        <a class="btn btn-ghost ed-mini" id="ed-open" href="#" target="_blank" rel="noopener">Abrir</a>
      </div>
    </div>
    <!-- painel de histórico (some por padrão) -->
    <div class="ed-hist-panel" id="ed-hist-panel" style="display:none">
      <div class="ed-hist-head"><b>Histórico do site</b><span class="x" title="Fechar" onclick="edFecharHistorico()">&times;</span></div>
      <div class="ed-hist-list" id="ed-hist-list"><p style="color:var(--muted);font-size:.85rem;padding:8px 2px">Carregando…</p></div>
    </div>
    <div class="ed-frame-wrap">
      <div class="ed-hint" id="ed-hint">Dica: clique numa parte do site pra editar só ela</div>
      <iframe id="ed-frame" title="Prévia do site"></iframe>
      <div class="ed-loading" id="ed-loading" style="display:none">
        <div class="ed-spin"></div>
        <p>A Mistto está aplicando sua mudança…</p>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>
<script>initEditor();</script>
</body>
</html>
